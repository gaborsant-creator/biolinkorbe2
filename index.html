<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ORBE — Digital Studio</title>
  <meta name="description" content="Soluções digitais que conectam pessoas, ideias e possibilidades." />
  <meta name="theme-color" content="#030303" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23050505' stroke='%23C5A059' stroke-width='2'/><text x='50' y='56' fill='%23FFFFFF' font-size='20' font-family='sans-serif' text-anchor='middle' letter-spacing='3'>ORBE</text></svg>" />

  <!-- Fonts: Syncopate (geometric heading), Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient Space Canvas for Desktop presentation -->
  <div class="space-stars" aria-hidden="true"></div>
  <div class="ambient-glow top-glow"></div>
  <div class="ambient-glow bottom-glow"></div>

  <!-- Responsive Ambient Banner (Mobile & Desktop) -->
  <div class="desktop-banner-wrapper" aria-hidden="true">
    <picture>
      <source media="(max-width: 767px)" srcset="assets/bg_mobile.jpg" />
      <source media="(min-width: 768px)" srcset="assets/bg_desktop.jpg" />
      <img src="assets/bg_desktop.jpg" alt="" class="desktop-banner-img" />
    </picture>
    <div class="desktop-banner-overlay"></div>
  </div>

  <!-- Main Mobile Frame Container -->
  <main class="phone-frame" id="app">
    <!-- Top Notch / Status indicator (visible in framed desktop mode) -->
    <div class="status-bar" aria-hidden="true">
      <div class="status-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="status-notch"></div>
    </div>

    <!-- Inner Biolink Content -->
    <div class="biolink-container">
      
      <!-- 2. CABEÇALHO -->
      <header class="header-section fade-in" style="--delay: 1">
        <!-- Logo Avatar Circular -->
        <div class="avatar-wrapper">
          <div class="avatar-glow"></div>
          <div class="avatar-circle">
            <img src="assets/logo.png" alt="Logo ORBE" class="avatar-img" />
          </div>
        </div>

        <!-- Nome ORBE + Selo Branco Verificado -->
        <div class="brand-row">
          <h1 class="brand-name">ORBE</h1>
          <!-- Selo Branco Verificado com gradiente e checkmark escuro -->
          <span class="verified-badge" title="Verificado ORBE" aria-label="Verificado">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="badge-svg">
              <defs>
                <linearGradient id="whiteBadgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFFFFF" />
                  <stop offset="60%" stop-color="#F1F5F9" />
                  <stop offset="100%" stop-color="#E2E8F0" />
                </linearGradient>
              </defs>
              <!-- 8-scallop smooth verified rosette -->
              <path d="M22.5 12.5c0-1.58-.88-2.95-2.15-3.6.15-.43.24-.9.24-1.4 0-2.21-1.79-4-4-4-.49 0-.96.08-1.4.24C14.55 2.47 13.18 1.6 11.6 1.6c-1.58 0-2.95.88-3.6 2.15-.43-.16-.9-.24-1.4-.24-2.21 0-4 1.79-4 4 0 .49.08.97.24 1.4C1.57 9.55.7 10.92.7 12.5c0 1.58.88 2.95 2.15 3.6-.15.43-.24.9-.24 1.4 0 2.21 1.79 4 4 4 .49 0 .97-.08 1.4-.24 1.15 1.27 2.52 2.15 4.1 2.15 1.58 0 2.95-.88 3.6-2.15.43.15.91.24 1.4.24 2.21 0 4-1.79 4-4 0-.49-.08-.97-.24-1.4 1.27-1.15 2.15-2.52 2.15-4.1z" fill="url(#whiteBadgeGradient)" />
              <!-- Dark checkmark inside -->
              <path d="M7.8 12.5L10.5 15.3L16.2 9.4" stroke="#090A0D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </div>

        <!-- Subtítulo: DIGITAL STUDIO com linhas laterais -->
        <div class="brand-tagline-wrapper">
          <span class="tagline-line line-left" aria-hidden="true"></span>
          <span class="brand-tagline">DIGITAL STUDIO</span>
          <span class="tagline-line line-right" aria-hidden="true"></span>
        </div>

        <!-- Texto de Apresentação -->
        <p class="brand-intro">
          Soluções digitais que conectam<br />
          pessoas, ideias e possibilidades.
        </p>
      </header>

      <!-- 4. BOTÕES PRINCIPAIS (3 CARDS) -->
      <section class="cards-section" aria-label="Links Principais">

        <!-- CARD 01 — NOSSO SITE -->
        <a href="https://orbetest2-zeta.vercel.app/" target="_blank" rel="noopener noreferrer" class="link-card fade-in" style="--delay: 2" data-card="site">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Thumbnail / Miniatura da esquerda -->
            <div class="card-media thumb-media">
              <img src="assets/thumb_site.png" alt="Preview Nosso Site" class="media-thumb-img" />
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">NOSSO SITE</span>
              <h2 class="card-title">Conheça a ORBE</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

        <!-- CARD 02 — SUPORTE / WHATSAPP -->
        <a href="https://wa.me/5511942237195" target="_blank" rel="noopener noreferrer" class="link-card fade-in" style="--delay: 3" data-card="suporte">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Ícone WhatsApp na esquerda -->
            <div class="card-media icon-media">
              <svg viewBox="0 0 24 24" fill="currentColor" class="media-icon">
                <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24h-.18zm4.52 11.59c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.24-.74-.66-1.25-1.48-1.39-1.73-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.08-.17.04-.32-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.08 0 1.22.89 2.41 1.01 2.58.13.17 1.75 2.68 4.25 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3z"/>
              </svg>
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">SUPORTE</span>
              <h2 class="card-title">Fale com nossa equipe</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

        <!-- CARD 03 — INSTAGRAM -->
        <a href="https://www.instagram.com/orbe.digi/" target="_blank" rel="noopener noreferrer" class="link-card fade-in" style="--delay: 4" data-card="instagram">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Ícone Instagram na esquerda -->
            <div class="card-media icon-media">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="media-icon">
                <rect x="2" y="2" width="20" height="20" rx="5.5" ry="5.5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
              </svg>
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">Rede social</span>
              <h2 class="card-title">Conheça nosso Instagram</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

      </section>

      <!-- 6. RODAPÉ -->
      <footer class="footer-section fade-in" style="--delay: 7">
        <div class="footer-divider">
          <span class="divider-line line-left"></span>
          <span class="footer-logo">ORBE</span>
          <span class="divider-line line-right"></span>
        </div>
        <p class="footer-phrase">Construindo um futuro digital.</p>
      </footer>

    </div>
  </main>

  <!-- Interactive Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-icon">✓</span>
    <span class="toast-text" id="toast-text">Link copiado com sucesso!</span>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
