<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ORBE — Tecnologia. Inovação. Futuro.</title>
  <meta name="description" content="Soluções digitais que conectam pessoas, ideias e possibilidades." />
  <meta name="theme-color" content="#030303" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23050505' stroke='%23C5A059' stroke-width='2'/><text x='50' y='56' fill='%23FFFFFF' font-size='20' font-family='sans-serif' text-anchor='middle' letter-spacing='3'>ORBE</text></svg>" />

  <!-- Fonts: Space Grotesk (geometric headings) & Plus Jakarta Sans (body & tags) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient Space Canvas for Desktop presentation -->
  <div class="space-stars" aria-hidden="true"></div>
  <div class="ambient-glow top-glow"></div>
  <div class="ambient-glow bottom-glow"></div>

  <!-- Panoramic Desktop Banner (Full Screen Width) -->
  <div class="desktop-banner-wrapper" aria-hidden="true">
    <img src="assets/bg_desktop.jpg" alt="" class="desktop-banner-img" />
    <div class="desktop-banner-overlay"></div>
  </div>

  <!-- Main Mobile Frame Container -->
  <main class="phone-frame" id="app">
    <!-- Top Notch / Status indicator (visible in framed desktop mode) -->
    <div class="status-bar" aria-hidden="true">
      <div class="status-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="status-notch"></div>
    </div>

    <!-- Inner Biolink Content -->
    <div class="biolink-container">
      
      <!-- 2. CABEÇALHO -->
      <header class="header-section fade-in" style="--delay: 1">
        <!-- Logo Avatar Circular -->
        <div class="avatar-wrapper">
          <div class="avatar-glow"></div>
          <div class="avatar-circle">
            <span class="avatar-text">ORBE</span>
          </div>
        </div>

        <!-- Nome ORBE + Selo Dourado Verificado -->
        <div class="brand-row">
          <h1 class="brand-name">ORBE</h1>
          <!-- Selo Dourado com gradiente metálico e checkmark escuro -->
          <span class="gold-badge" title="Verificado ORBE" aria-label="Verificado">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="badge-svg">
              <defs>
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F5E5C0" />
                  <stop offset="40%" stop-color="#D4AF37" />
                  <stop offset="75%" stop-color="#A6802C" />
                  <stop offset="100%" stop-color="#E2C98E" />
                </linearGradient>
              </defs>
              <!-- 8-scallop smooth verified rosette -->
              <path d="M22.5 12.5c0-1.58-.88-2.95-2.15-3.6.15-.43.24-.9.24-1.4 0-2.21-1.79-4-4-4-.49 0-.96.08-1.4.24C14.55 2.47 13.18 1.6 11.6 1.6c-1.58 0-2.95.88-3.6 2.15-.43-.16-.9-.24-1.4-.24-2.21 0-4 1.79-4 4 0 .49.08.97.24 1.4C1.57 9.55.7 10.92.7 12.5c0 1.58.88 2.95 2.15 3.6-.15.43-.24.9-.24 1.4 0 2.21 1.79 4 4 4 .49 0 .97-.08 1.4-.24 1.15 1.27 2.52 2.15 4.1 2.15 1.58 0 2.95-.88 3.6-2.15.43.15.91.24 1.4.24 2.21 0 4-1.79 4-4 0-.49-.08-.97-.24-1.4 1.27-1.15 2.15-2.52 2.15-4.1z" fill="url(#goldGradient)" />
              <!-- Dark checkmark inside -->
              <path d="M7.8 12.5L10.5 15.3L16.2 9.4" stroke="#121316" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </div>

        <!-- Frase de Impacto -->
        <p class="brand-tagline">Tecnologia. Inovação. Futuro.</p>

        <!-- Texto de Apresentação -->
        <p class="brand-intro">
          Soluções digitais que conectam<br />
          pessoas, ideias e possibilidades.
        </p>
      </header>

      <!-- 4. BOTÕES PRINCIPAIS (4 CARDS) -->
      <section class="cards-section" aria-label="Links Principais">

        <!-- CARD 01 — NOSSO SITE -->
        <a href="#site" class="link-card fade-in" style="--delay: 3" data-card="site">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Thumbnail / Miniatura da esquerda -->
            <div class="card-media thumb-media">
              <img src="assets/thumb_site.png" alt="Preview Nosso Site" class="media-thumb-img" />
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">NOSSO SITE</span>
              <h2 class="card-title">Conheça a ORBE</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

        <!-- CARD 02 — PORTFÓLIO -->
        <a href="#portfolio" class="link-card fade-in" style="--delay: 4" data-card="portfolio">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Ícone cubo 3D isométrico na esquerda -->
            <div class="card-media icon-media">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="media-icon">
                <path d="M12 2.5L20.5 7.4V16.6L12 21.5L3.5 16.6V7.4L12 2.5Z"></path>
                <path d="M12 12V21.5"></path>
                <path d="M12 12L20.5 7.4"></path>
                <path d="M12 12L3.5 7.4"></path>
              </svg>
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">PORTFÓLIO</span>
              <h2 class="card-title">Explore nossos projetos</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

        <!-- CARD 03 — BLOG -->
        <a href="#blog" class="link-card fade-in" style="--delay: 5" data-card="blog">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Ícone documento na esquerda -->
            <div class="card-media icon-media">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="media-icon">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <line x1="10" y1="9" x2="8" y2="9"></line>
              </svg>
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">BLOG</span>
              <h2 class="card-title">Acesse nosso conteúdo</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

        <!-- CARD 04 — SUPORTE -->
        <a href="#suporte" class="link-card fade-in" style="--delay: 6" data-card="suporte">
          <div class="card-glass-specular"></div>
          <div class="card-inner">
            <!-- Ícone fone de ouvido / suporte na esquerda -->
            <div class="card-media icon-media">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="media-icon">
                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
              </svg>
            </div>
            <!-- Textos informativos -->
            <div class="card-content">
              <span class="card-category">SUPORTE</span>
              <h2 class="card-title">Fale com a nossa equipe</h2>
            </div>
            <!-- Botão circular com seta -->
            <div class="card-action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-arrow">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>
        </a>

      </section>

      <!-- 6. RODAPÉ -->
      <footer class="footer-section fade-in" style="--delay: 7">
        <div class="footer-divider">
          <span class="divider-line line-left"></span>
          <span class="footer-logo">ORBE</span>
          <span class="divider-line line-right"></span>
        </div>
        <p class="footer-phrase">Construindo um futuro digital.</p>
      </footer>

    </div>
  </main>

  <!-- Interactive Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-icon">✓</span>
    <span class="toast-text" id="toast-text">Link copiado com sucesso!</span>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
